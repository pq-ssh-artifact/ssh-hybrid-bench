name: bench-arm64
on:
  workflow_dispatch:
    inputs:
      repeat:
        description: "Numéro de passe (1, 2, ...)"
        default: "1"
jobs:
  bench:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de la plateforme
        run: |
          cp config/platform.env.example config/platform.env
          sed -i 's/^PLATFORM_ID=.*/PLATFORM_ID=arm64/' config/platform.env
          sed -i "s|^HARNESS_DIR=.*|HARNESS_DIR=$GITHUB_WORKSPACE/harness|" config/platform.env
          lscpu
      - name: Dépendances
        run: bash ./00_install_deps.sh
      - name: Compilation d'OpenSSH 10.0p2
        run: bash ./01_build_openssh.sh
      - name: Compilation du harnais
        run: |
          . config/platform.env
          cd harness && bash ./build.sh "$OPENSSH_SRC"
      - name: Préparation de la machine
        run: bash ./02_prepare_host.sh
      - name: Environnement (Tableau 3)
        run: bash ./03_collect_env.sh
      - name: Mesures
        run: bash ./04_run_benchmarks.sh all
      - name: Récupération des résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-arm64-pass${{ github.event.inputs.repeat }}
          path: results/arm64
